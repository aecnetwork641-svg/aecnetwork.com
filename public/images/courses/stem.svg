<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-stem)" />

  <!-- Math & Science Floating Symbols -->
  <g opacity="0.15" fill="none" stroke="#ffffff" stroke-width="2">
    <circle cx="100" cy="100" r="40" />
    <polygon points="500,80 540,150 460,150" />
    <text x="80" y="300" fill="#ffffff" font-size="60" font-family="serif">∑</text>
    <text x="480" y="320" fill="#ffffff" font-size="60" font-family="serif">π</text>
    <text x="280" y="70" fill="#ffffff" font-size="50" font-family="serif">∞</text>
  </g>

  <!-- Central Atom & DNA Graphic -->
  <g transform="translate(300, 175)">
    <!-- Atom Orbits -->
    <ellipse cx="0" cy="0" rx="110" ry="40" fill="none" stroke="url(#cyan-glow)" stroke-width="3.5" transform="rotate(0)" />
    <ellipse cx="0" cy="0" rx="110" ry="40" fill="none" stroke="url(#cyan-glow)" stroke-width="3.5" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="110" ry="40" fill="none" stroke="url(#cyan-glow)" stroke-width="3.5" transform="rotate(120)" />

    <!-- Electrons -->
    <circle cx="-110" cy="0" r="8" fill="#38bdf8" />
    <circle cx="55" cy="95" r="8" fill="#818cf8" />
    <circle cx="55" cy="-95" r="8" fill="#38bdf8" />

    <!-- Core Nucleus -->
    <circle cx="0" cy="0" r="24" fill="#38bdf8" />
    <circle cx="-6" cy="-6" r="14" fill="#818cf8" />
    <circle cx="6" cy="6" r="10" fill="#ffffff" />
  </g>

  <!-- Category Label Badge -->
  <rect x="150" y="320" width="300" height="38" rx="19" fill="#0f172a" opacity="0.85" stroke="#38bdf8" stroke-width="1.5" />
  <text x="300" y="344" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">STEM &amp; ACADEMIC SCIENCES</text>
</svg>
