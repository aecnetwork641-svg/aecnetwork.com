<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3E66" />
      <stop offset="100%" stop-color="#0F2A47" />
    </linearGradient>
    <linearGradient id="scrollGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="60%" stop-color="#C9A24B" />
      <stop offset="100%" stop-color="#8C6219" />
    </linearGradient>
    <linearGradient id="bookLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="100%" stop-color="#5C2C16" />
    </linearGradient>
  </defs>

  <!-- Rounded Background -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" />

  <g transform="translate(18, 14)">
    <!-- Scroll on top -->
    <path d="M22,22 C22,14 46,14 46,22 C46,27 22,27 22,22 Z" fill="url(#scrollGold)" />
    <path d="M46,22 C46,18 52,18 52,22 C52,26 46,26 46,22 Z" fill="#E5C158" />

    <!-- Top Book (Brown Leather) -->
    <rect x="12" y="28" width="60" height="24" rx="3" fill="url(#bookLeather)" stroke="#3E1A08" stroke-width="1.5" />
    <!-- Pages edge -->
    <rect x="68" y="32" width="4" height="16" rx="1" fill="#FAF7F0" />
    <text x="42" y="44" font-family="serif" font-size="9" font-weight="bold" fill="#F38258" text-anchor="middle">AEC</text>

    <!-- Middle Book -->
    <rect x="6" y="52" width="72" height="16" rx="2" fill="#703611" stroke="#3A1705" stroke-width="1.5" />
    <rect x="74" y="55" width="4" height="10" rx="1" fill="#E2D8C3" />

    <!-- Bottom Book (Ornate Gold/Green Spine) -->
    <rect x="10" y="68" width="64" height="15" rx="2" fill="#2D4A3E" stroke="#C9A24B" stroke-width="1.2" />
    <line x1="20" y1="68" x2="20" y2="83" stroke="#C9A24B" stroke-width="1" />
    <line x1="64" y1="68" x2="64" y2="83" stroke="#C9A24B" stroke-width="1" />
  </g>
</svg>
