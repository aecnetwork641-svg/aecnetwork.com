<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg-code)" />

  <!-- Code matrix overlay -->
  <g opacity="0.1" fill="#a855f7" font-family="monospace" font-size="14">
    <text x="30" y="40">&lt;div class="aec-network"&gt;</text>
    <text x="50" y="70">const learn = () =&gt; async ();</text>
    <text x="30" y="100">import { NextJS, React } from 'aec';</text>
    <text x="400" y="60">function buildFuture() {</text>
    <text x="420" y="90">return true;</text>
    <text x="400" y="120">}</text>
    <text x="30" y="320">SELECT * FROM courses WHERE active = 1;</text>
  </g>

  <!-- Central Laptop Window & Code Graphic -->
  <g transform="translate(300, 170)">
    <!-- Laptop Screen -->
    <rect x="-120" y="-80" width="240" height="150" rx="10" fill="#1e1b4b" stroke="url(#purple-glow)" stroke-width="3.5" />
    <!-- Window Bar -->
    <rect x="-120" y="-80" width="240" height="25" rx="8" fill="#0f172a" />
    <circle cx="-100" cy="-67" r="4" fill="#ef4444" />
    <circle cx="-88" cy="-67" r="4" fill="#eab308" />
    <circle cx="-76" cy="-67" r="4" fill="#22c55e" />

    <!-- Code Brackets & Syntax -->
    <text x="-80" y="-10" fill="#a855f7" font-family="monospace" font-size="32" font-weight="bold">&lt;/&gt;</text>

    <line x1="-30" y1="-25" x2="70" y2="-25" stroke="#ec4899" stroke-width="4" stroke-linecap="round" />
    <line x1="-30" y1="-10" x2="40" y2="-10" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="-80" y1="15" x2="50" y2="15" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
    <line x1="-80" y1="32" x2="10" y2="32" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />

    <!-- Laptop Base / Keyboard -->
    <path d="M -150 70 L 150 70 L 130 85 L -130 85 Z" fill="#334155" />
    <rect x="-30" y="70" width="60" height="6" rx="3" fill="#64748b" />
  </g>

  <!-- Category Label Badge -->
  <rect x="150" y="320" width="300" height="38" rx="19" fill="#0f172a" opacity="0.85" stroke="#a855f7" stroke-width="1.5" />
  <text x="300" y="344" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">IT, CODING &amp; WEB DEV</text>
</svg>
